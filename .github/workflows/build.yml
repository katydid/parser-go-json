name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: gopath/git.katydid.org.za/go/parser-go-json
    - name: Setup Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.26
    - name: Fetch dependencies
      run: |
        cd gopath/ggit.katydid.org.za/go/parser-go-json
        go mod download -x
    - name: env
      run: env && go env && pwd
    - name: tree
      run: tree
    - name: Build
      run: |
        cd gopath/ggit.katydid.org.za/go/parser-go-json
        make build
    - name: Test
      run: |
        cd gopath/ggit.katydid.org.za/go/parser-go-json
        make test
    - name: Test PureGo
      run: |
        cd gopath/ggit.katydid.org.za/go/parser-go-json
        make test-purego
    - name: Checklicencse
      uses: awalterschulze/checklicense@v1.0.6
      with:
        path: gopath/ggit.katydid.org.za/go/parser-go-json
        ignores: doc.go .png .svg .txt
    - name: Diff
      run: |
        cd gopath/ggit.katydid.org.za/go/parser-go-json
        make diff
